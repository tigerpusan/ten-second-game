<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>10초 맞추기</title>
  <meta name="theme-color" content="#ff970f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{--coffee:#3e2b27;--orange:#ff970f;--orange2:#ffae3b;--line:#f2d2ad;--red:#ff4747;--muted:#7a5b46;--ok:#16a34a;--perfect:#d97706}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:linear-gradient(180deg,#fffdfa,#fff4e8);font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--coffee)}
    body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
    .game{width:min(100%,560px);min-height:100vh;background:linear-gradient(180deg,#fffdf9,#fff8ef);border:1px solid #f7dfc1;border-radius:28px;padding:22px 16px 24px;text-align:center;position:relative;overflow:hidden;box-shadow:0 10px 35px rgba(102,70,35,.08)}
    .gear{position:absolute;right:14px;top:14px;width:44px;height:44px;border:2px solid #222;border-radius:50%;background:#fff;font-size:20px;cursor:pointer}
    h1{margin:6px 0 0;font-size:30px;font-weight:900;letter-spacing:-1px}
    .rule-top{margin-top:10px;font-size:14px;font-weight:800;color:var(--muted)}
    .buddy-row{margin-top:22px;display:flex;gap:12px;align-items:center;justify-content:center}
    .buddy{width:94px;height:94px;border:2px solid #ffd59e;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative}
    .bubble{flex:1;min-width:0;min-height:92px;border:2px dashed #ffc36f;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;padding:12px 16px;font-size:18px;font-weight:900;line-height:1.45;word-break:keep-all}
    .timer{margin-top:26px;font-size:78px;line-height:1;font-weight:900;letter-spacing:-3px;font-variant-numeric:tabular-nums}
    .seconds{margin-top:8px;font-size:13px;font-weight:900;letter-spacing:2px;color:var(--muted)}
    .slots{margin-top:24px;display:flex;justify-content:center;gap:12px}
    .slot{width:88px;height:100px;border:2px solid var(--line);border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:inset 0 -6px 14px rgba(255,151,15,.06)}
    .slot.spin{animation:slotShake .22s linear infinite}
    @keyframes slotShake{0%{transform:translateY(-2px)}50%{transform:translateY(2px)}100%{transform:translateY(-2px)}}
    .result{min-height:48px;margin-top:24px;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1.35;padding:0 8px}
    .result.fail{color:var(--red)}.result.ok{color:var(--ok)}.result.perfect{color:var(--perfect)}
    .main{margin-top:8px;width:100%;min-height:88px;border:0;border-radius:24px;background:linear-gradient(180deg,var(--orange2),var(--orange));color:#fff;font-size:34px;font-weight:900;cursor:pointer;box-shadow:0 12px 24px rgba(255,138,0,.22)}
    .main:active{transform:scale(.99)}
    .again{margin-top:12px;border:0;border-radius:14px;background:#fff;padding:12px 18px;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 6px 15px rgba(0,0,0,.06)}
    .foot{margin-top:16px;font-size:13px;font-weight:800;line-height:1.6;color:var(--muted)}
    .settings{display:none;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;gap:8px;flex-wrap:wrap;justify-content:center}
    .settings.show{display:flex}
    .settings input{width:120px;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 10px;font-size:16px}
    .settings button{min-height:44px;border:0;border-radius:12px;padding:0 14px;font-weight:900;background:#fff0dd;color:var(--coffee);cursor:pointer}
    .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .piece{position:absolute;width:9px;height:15px;border-radius:2px;animation:fall 1.6s linear forwards}
    @keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(650px) rotate(540deg)}}

    /* 귀엽고 장난스러운 첫 번째 느낌의 캐릭터 */
    .char-wrap{position:relative;width:64px;height:64px}
    .char-main{position:absolute;inset:6px 4px;background:#fff;border:5px solid #2a211e;border-radius:50% 48% 52% 50%}
    .char-bump{position:absolute;left:10px;top:-2px;width:22px;height:20px;background:#fff;border:5px solid #2a211e;border-bottom:0;border-right-width:4px;border-radius:55% 55% 0 0;transform:rotate(-10deg)}
    .eye-left,.eye-right{position:absolute;top:24px;width:10px;height:12px;background:#2a211e;border-radius:50%}
    .eye-left{left:17px}.eye-right{right:16px;height:4px;width:12px;border-radius:10px;transform:rotate(-18deg);top:28px}
    .mouth{position:absolute;left:25px;top:33px;width:12px;height:9px;border:4px solid #2a211e;border-top:0;border-radius:0 0 14px 14px;background:#ff8b86}
    .tongue{position:absolute;left:31px;top:38px;width:9px;height:10px;background:#ff7a72;border:3px solid #2a211e;border-top:0;border-radius:0 0 10px 10px;transform:rotate(8deg)}
    .cheek-left,.cheek-right{position:absolute;top:34px;width:10px;height:8px;background:#ffb0a7;border-radius:50%;opacity:.9}
    .cheek-left{left:8px}.cheek-right{right:8px}
    .hand-left,.hand-right{position:absolute;bottom:6px;width:16px;height:14px;background:#fff;border:4px solid #2a211e;border-radius:50%}
    .hand-left{left:2px}.hand-right{right:2px}
    .spark1,.spark2{position:absolute;background:#ffbe4a;border-radius:6px}
    .spark1{right:-3px;top:4px;width:7px;height:18px;transform:rotate(25deg)}.spark2{right:8px;top:1px;width:7px;height:14px;transform:rotate(-20deg)}

    @media(max-width:430px){.game{padding-left:12px;padding-right:12px;border-radius:0;min-height:100dvh}h1{font-size:27px}.buddy{width:82px;height:82px}.bubble{font-size:16px;min-height:82px}.timer{font-size:64px}.slot{width:78px;height:92px;font-size:38px}.main{min-height:82px;font-size:30px}.char-wrap{transform:scale(.88)}}
  </style>
</head>
<body>
  <section class="game">
    <button class="gear" id="gearBtn" type="button" aria-label="설정">⚙</button>
    <h1 id="title">10초 맞추기</h1>
    <div class="rule-top" id="topRule">9.97 ~ 10.02초에 멈추면 성공!</div>

    <div class="buddy-row">
      <div class="buddy" aria-hidden="true">
        <div class="char-wrap">
          <span class="char-bump"></span><span class="char-main"></span><span class="eye-left"></span><span class="eye-right"></span><span class="mouth"></span><span class="tongue"></span><span class="cheek-left"></span><span class="cheek-right"></span><span class="hand-left"></span><span class="hand-right"></span><span class="spark1"></span><span class="spark2"></span>
        </div>
      </div>
      <div class="bubble" id="bubble">10초를 맞추세요!</div>
    </div>

    <div class="timer" id="timer">0.00</div>
    <div class="seconds">SECONDS</div>

    <div class="slots"><div class="slot" id="s1">☕</div><div class="slot" id="s2">🎯</div><div class="slot" id="s3">⭐</div></div>

    <div class="result" id="result" aria-live="polite">준비되면 시작!</div>
    <button class="main" id="mainBtn" type="button">START</button>
    <button class="again" id="againBtn" type="button">다시 하기</button>

    <div class="foot">성공 범위: <b id="rangeText">9.97 ~ 10.02초</b><br>PERFECT: 정확히 <b id="targetText">10.00초</b></div>

    <div class="settings" id="settings">
      <input id="titleInput" type="text" maxlength="30" value="10초 맞추기" aria-label="제목">
      <input id="minInput" type="number" step="0.01" value="9.97" aria-label="성공 최소 시간">
      <input id="maxInput" type="number" step="0.01" value="10.02" aria-label="성공 최대 시간">
      <input id="targetInput" type="number" step="0.01" value="10.00" aria-label="퍼펙트 시간">
      <button id="saveBtn" type="button">적용</button>
    </div>
    <div class="confetti" id="confetti"></div>
  </section>

  <script>
    (()=>{
      const timer=document.getElementById('timer'),result=document.getElementById('result'),bubble=document.getElementById('bubble'),main=document.getElementById('mainBtn'),again=document.getElementById('againBtn');
      const slots=[document.getElementById('s1'),document.getElementById('s2'),document.getElementById('s3')];
      const gear=document.getElementById('gearBtn'),settings=document.getElementById('settings'),title=document.getElementById('title'),titleInput=document.getElementById('titleInput'),minInput=document.getElementById('minInput'),maxInput=document.getElementById('maxInput'),targetInput=document.getElementById('targetInput'),save=document.getElementById('saveBtn'),rangeText=document.getElementById('rangeText'),targetText=document.getElementById('targetText'),topRule=document.getElementById('topRule'),confetti=document.getElementById('confetti');
      const symbols=['☕','🎯','⭐','🍀','🎉','🏆','🔥','10','🎈','💫'];
      let running=false,start=0,raf=null,slotIntervals=[],min=9.97,max=10.02,target=10.00;

      function render(){if(!running)return;timer.textContent=((performance.now()-start)/1000).toFixed(2);raf=requestAnimationFrame(render)}
      function startSlots(){stopIntervals();slots.forEach(x=>x.classList.add('spin'));slotIntervals=slots.map((el,i)=>setInterval(()=>{el.textContent=symbols[Math.floor(Math.random()*symbols.length)]},85+i*25))}
      function stopIntervals(){slotIntervals.forEach(clearInterval);slotIntervals=[];slots.forEach(x=>x.classList.remove('spin'))}
      function resetSlots(){slots[0].textContent='☕';slots[1].textContent='🎯';slots[2].textContent='⭐'}
      function celebrate(){confetti.innerHTML='';for(let i=0;i<30;i++){const p=document.createElement('span');p.className='piece';p.style.left=Math.random()*100+'%';p.style.top=(-40-Math.random()*100)+'px';p.style.background=['#ff970f','#ffd54f','#22c55e','#ef4444','#3b82f6','#a855f7'][Math.floor(Math.random()*6)];p.style.animationDuration=(1.1+Math.random()*1.1)+'s';confetti.appendChild(p)}setTimeout(()=>confetti.innerHTML='',2200)}
      function startGame(){running=true;start=performance.now();result.className='result';result.textContent='측정 중...';bubble.textContent='10초를 맞추세요!';main.textContent='STOP';startSlots();render()}
      function stopGame(){running=false;if(raf)cancelAnimationFrame(raf);stopIntervals();const shown=Math.round(((performance.now()-start)/1000)*100)/100;timer.textContent=shown.toFixed(2);main.textContent='다시 시작';
        if(shown===target){result.className='result perfect';result.textContent='🎉 PERFECT! 정확히 '+target.toFixed(2)+'초!';bubble.textContent='완벽해요! 정확히 맞췄어요!';slots[0].textContent='👑';slots[1].textContent='10';slots[2].textContent='👑';celebrate()}
        else if(shown>=min&&shown<=max){result.className='result ok';result.textContent='🎊 성공! 합격입니다!';bubble.textContent='성공했어요! 한 번 더 도전!';slots[0].textContent='🎉';slots[1].textContent='🏆';slots[2].textContent='🎉';celebrate()}
        else if(shown<min){result.className='result fail';result.textContent='아쉽다! '+Math.abs(target-shown).toFixed(2)+'초 빨랐어요';bubble.innerHTML='조금 빨랐어요!<br>다음엔 살짝 더 늦게!';resetSlots()}
        else{result.className='result fail';result.textContent='아쉽다! '+Math.abs(shown-target).toFixed(2)+'초 늦었어요';bubble.innerHTML='조금 늦었어요!<br>다음엔 살짝 더 빨리!';resetSlots()}
      }
      function reset(){running=false;if(raf)cancelAnimationFrame(raf);stopIntervals();timer.textContent='0.00';result.className='result';result.textContent='준비되면 시작!';bubble.textContent='10초를 맞추세요!';main.textContent='START';resetSlots()}
      main.addEventListener('click',()=>running?stopGame():startGame());
      again.addEventListener('click',reset);
      gear.addEventListener('click',()=>settings.classList.toggle('show'));
      save.addEventListener('click',()=>{const a=parseFloat(minInput.value),b=parseFloat(maxInput.value),t=parseFloat(targetInput.value),ttl=titleInput.value.trim();if(!Number.isFinite(a)||!Number.isFinite(b)||!Number.isFinite(t)||a>b){alert('설정을 다시 확인하세요.');return}if(ttl)title.textContent=ttl;min=+a.toFixed(2);max=+b.toFixed(2);target=+t.toFixed(2);rangeText.textContent=min.toFixed(2)+' ~ '+max.toFixed(2)+'초';targetText.textContent=target.toFixed(2)+'초';topRule.textContent=min.toFixed(2)+' ~ '+max.toFixed(2)+'초에 멈추면 성공!';settings.classList.remove('show');reset()});
      if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
      reset();
    })();
  </script>
</body>
</html>
