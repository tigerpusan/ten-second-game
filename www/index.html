<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>10초 게임</title><meta name="theme-color" content="#ff970f"><meta name="application-name" content="10초 게임"><link rel="manifest" href="manifest.webmanifest"><style>:root{--coffee:#3e2b27;--orange:#ff970f;--orange2:#ffae3b;--line:#f2d2ad;--red:#ff4747;--muted:#7a5b46;--ok:#16a34a;--perfect:#d97706}*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#fffdfa,#fff4e8);font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--coffee)}body{min-height:100vh;display:flex;justify-content:center}.game{width:min(100%,560px);min-height:100vh;background:linear-gradient(180deg,#fffdf9,#fff8ef);border:1px solid #f7dfc1;border-radius:28px;padding:22px 16px 24px;text-align:center;position:relative;overflow:hidden}.gear{position:absolute;right:14px;top:14px;width:44px;height:44px;border:2px solid #222;border-radius:50%;background:#fff;font-size:20px}.game h1{margin:6px 0 0;font-size:30px;font-weight:900}.rule-top{margin-top:10px;font-size:14px;font-weight:800;color:var(--muted)}.buddy-row{margin-top:22px;display:flex;gap:12px;align-items:center}.buddy{width:94px;height:94px;border:2px solid #ffd59e;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.bubble{flex:1;min-height:92px;border:2px dashed #ffc36f;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;padding:12px;font-size:18px;font-weight:900}.timer{margin-top:26px;font-size:78px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}.seconds{margin-top:8px;font-size:13px;font-weight:900;letter-spacing:2px;color:var(--muted)}.slots{margin-top:24px;display:flex;justify-content:center;gap:12px}.slot{width:88px;height:100px;border:2px solid var(--line);border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:42px}.slot.spin{animation:shake .22s linear infinite}@keyframes shake{50%{transform:translateY(2px)}}.result{min-height:48px;margin-top:24px;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center}.result.fail{color:var(--red)}.result.ok{color:var(--ok)}.result.perfect{color:var(--perfect)}.main{margin-top:8px;width:100%;min-height:88px;border:0;border-radius:24px;background:linear-gradient(180deg,var(--orange2),var(--orange));color:#fff;font-size:34px;font-weight:900}.again{margin-top:12px;border:0;border-radius:14px;background:#fff;padding:12px 18px;font-size:14px;font-weight:900}.foot{margin-top:16px;font-size:13px;font-weight:800;line-height:1.6;color:var(--muted)}.settings{display:none;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;gap:8px;flex-wrap:wrap;justify-content:center}.settings.show{display:flex}.settings input{width:120px;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 10px;font-size:16px}.settings button{min-height:44px;border:0;border-radius:12px;padding:0 14px;font-weight:900}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;width:9px;height:15px;animation:fall 1.5s linear forwards}@keyframes fall{to{transform:translateY(650px) rotate(540deg)}}.char-wrap{position:relative;width:64px;height:64px}.char-main{position:absolute;inset:6px 4px;background:#fff;border:5px solid #2a211e;border-radius:50%}.eye-left,.eye-right,.mouth,.tongue{position:absolute}.eye-left,.eye-right{background:#2a211e}.cheek-left,.cheek-right{position:absolute;top:36px;width:10px;height:7px;border-radius:50%;background:#ffb0a7}.cheek-left{left:8px}.cheek-right{right:8px}.spark1,.spark2{position:absolute;background:#ffbe4a;border-radius:6px}.spark1{right:-4px;top:4px;width:7px;height:18px}.spark2{right:8px;top:0;width:7px;height:14px}.idle .eye-left{left:17px;top:24px;width:10px;height:12px;border-radius:50%}.idle .eye-right{right:16px;top:28px;width:12px;height:4px;border-radius:8px}.idle .mouth{left:24px;top:35px;width:18px;height:8px;border:4px solid #2a211e;border-top:0;border-radius:0 0 12px 12px}.run-a .eye-left,.run-a .eye-right,.run-c .eye-left,.run-c .eye-right,.perfect .eye-left,.perfect .eye-right{top:24px;width:10px;height:10px;border-radius:50%}.run-a .eye-left,.run-c .eye-left,.perfect .eye-left{left:16px}.run-a .eye-right,.run-c .eye-right,.perfect .eye-right{right:16px}.run-b .eye-left{left:16px;top:28px;width:12px;height:4px;border-radius:8px}.run-b .eye-right{right:16px;top:24px;width:10px;height:12px;border-radius:50%}.run-d .eye-left,.run-d .eye-right,.late .eye-left,.late .eye-right,.success .eye-left,.success .eye-right{top:28px;width:13px;height:4px;border-radius:8px}.run-d .eye-left,.late .eye-left,.success .eye-left{left:14px}.run-d .eye-right,.late .eye-right,.success .eye-right{right:14px}.run-a .mouth,.run-b .mouth,.run-c .mouth,.run-d .mouth,.success .mouth,.perfect .mouth{left:22px;top:35px;width:20px;height:10px;border:4px solid #2a211e;border-top:0;border-radius:0 0 16px 16px}.fast .eye-left,.fast .eye-right{top:23px;width:11px;height:13px;border-radius:50%}.fast .eye-left{left:16px}.fast .eye-right{right:16px}.fast .mouth{left:27px;top:36px;width:10px;height:10px;border:4px solid #2a211e;border-radius:50%}.late .mouth{left:24px;top:39px;width:16px;height:4px;background:#2a211e;border-radius:6px}@media(max-width:430px){.game{border-radius:0;min-height:100dvh}.timer{font-size:64px}.slot{width:78px;height:92px}.main{min-height:82px;font-size:30px}}</style></head><body><section class="game"><button class="gear" id="gearBtn">⚙</button><h1 id="title">10초 맞추기</h1><div class="rule-top" id="topRule">9.97 ~ 10.02초에 멈추면 성공!</div><div class="buddy-row"><div class="buddy"><div class="char-wrap idle" id="characterFace"><span class="char-main"></span><span class="eye-left"></span><span class="eye-right"></span><span class="mouth"></span><span class="tongue"></span><span class="cheek-left"></span><span class="cheek-right"></span><span class="spark1"></span><span class="spark2"></span></div></div><div class="bubble" id="bubble">10초를 맞추세요!</div></div><div class="timer" id="timer">0.00</div><div class="seconds">SECONDS</div><div class="slots"><div class="slot" id="s1">☕</div><div class="slot" id="s2">🎯</div><div class="slot" id="s3">⭐</div></div><div class="result" id="result">준비되면 시작!</div><button class="main" id="mainBtn">START</button><button class="again" id="againBtn">다시 하기</button><div class="foot">성공 범위: <b id="rangeText">9.97 ~ 10.02초</b><br>PERFECT: 정확히 <b id="targetText">10.00초</b></div><div class="settings" id="settings"><input id="titleInput" value="10초 맞추기"><input id="minInput" type="number" step="0.01" value="9.97"><input id="maxInput" type="number" step="0.01" value="10.02"><input id="targetInput" type="number" step="0.01" value="10.00"><button id="saveBtn">적용</button></div><div class="confetti" id="confetti"></div></section><script>(()=>{const MASTER_VOLUME=0.10;const timer=document.getElementById('timer'),result=document.getElementById('result'),bubble=document.getElementById('bubble'),main=document.getElementById('mainBtn'),again=document.getElementById('againBtn'),slots=[s1,s2,s3],gear=document.getElementById('gearBtn'),settings=document.getElementById('settings'),title=document.getElementById('title'),titleInput=document.getElementById('titleInput'),minInput=document.getElementById('minInput'),maxInput=document.getElementById('maxInput'),targetInput=document.getElementById('targetInput'),save=document.getElementById('saveBtn'),rangeText=document.getElementById('rangeText'),targetText=document.getElementById('targetText'),topRule=document.getElementById('topRule'),confetti=document.getElementById('confetti'),character=document.getElementById('characterFace');const symbols=['☕','🎯','⭐','🍀','🎉','🏆','🔥','10','🎈','💫'];let running=false,start=0,raf=null,slotIntervals=[],min=9.97,max=10.02,target=10,faceTimer=null,faceIndex=0,audioCtx=null,lastTickSecond=-1;function ensureAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}function tone(f,d=.07,v=MASTER_VOLUME,type='sine',delay=0){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.min(.24,v),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+d+.02)}function playTick(s){tone(s===10?860:500,.05,s===10?.12:.08,'square')}function playResultSound(kind){if(kind==='perfect'){tone(660,.10,.16);tone(880,.12,.16,'sine',.09);tone(1120,.15,.18,'sine',.19)}else if(kind==='success'){tone(620,.09,.14);tone(840,.13,.15,'sine',.08)}else{tone(230,.14,.17,'sawtooth');tone(155,.18,.14,'sawtooth',.09)}}function setFace(s){character.className='char-wrap '+s}function startFaces(){stopFaces();const c=['run-a','run-b','run-c','run-d','idle'];faceIndex=0;setFace(c[0]);faceTimer=setInterval(()=>{faceIndex=(faceIndex+1)%c.length;setFace(c[faceIndex])},420)}function stopFaces(){if(faceTimer){clearInterval(faceTimer);faceTimer=null}}function render(){if(!running)return;const e=(performance.now()-start)/1000;timer.textContent=e.toFixed(2);const sec=Math.floor(e);if(sec!==lastTickSecond&&sec>=1&&sec<=10){lastTickSecond=sec;playTick(sec)}raf=requestAnimationFrame(render)}function startSlots(){stopSlots();slots.forEach(x=>x.classList.add('spin'));slotIntervals=slots.map((el,i)=>setInterval(()=>el.textContent=symbols[Math.floor(Math.random()*symbols.length)],90+i*25))}function stopSlots(){slotIntervals.forEach(clearInterval);slotIntervals=[];slots.forEach(x=>x.classList.remove('spin'))}function resetSlots(){slots[0].textContent='☕';slots[1].textContent='🎯';slots[2].textContent='⭐'}function celebrate(){confetti.innerHTML='';for(let i=0;i<30;i++){const p=document.createElement('span');p.className='piece';p.style.left=Math.random()*100+'%';p.style.top='-30px';p.style.background=['#ff970f','#ffd54f','#22c55e','#ef4444','#3b82f6','#a855f7'][i%6];confetti.appendChild(p)}setTimeout(()=>confetti.innerHTML='',1800)}function startGame(){ensureAudio();running=true;start=performance.now();lastTickSecond=-1;result.className='result';result.textContent='측정 중...';bubble.textContent='10초를 맞추세요!';main.textContent='STOP';startSlots();startFaces();render()}function stopGame(){running=false;if(raf)cancelAnimationFrame(raf);stopSlots();stopFaces();const shown=Math.round(((performance.now()-start)/1000)*100)/100;timer.textContent=shown.toFixed(2);main.textContent='다시 시작';if(shown===target){result.className='result perfect';result.textContent='🎉 PERFECT! 정확히 '+target.toFixed(2)+'초!';bubble.textContent='완벽해요! 정확히 맞췄어요!';slots[0].textContent='👑';slots[1].textContent='10';slots[2].textContent='👑';setFace('perfect');playResultSound('perfect');celebrate()}else if(shown>=min&&shown<=max){result.className='result ok';result.textContent='🎊 성공! 합격입니다!';bubble.textContent='성공했어요! 한 번 더 도전!';slots[0].textContent='🎉';slots[1].textContent='🏆';slots[2].textContent='🎉';setFace('success');playResultSound('success');celebrate()}else if(shown<min){result.className='result fail';result.textContent='아쉽다! '+Math.abs(target-shown).toFixed(2)+'초 빨랐어요';bubble.textContent='조금 빨랐어요!';resetSlots();setFace('fast');playResultSound('fail')}else{result.className='result fail';result.textContent='아쉽다! '+Math.abs(shown-target).toFixed(2)+'초 늦었어요';bubble.textContent='조금 늦었어요!';resetSlots();setFace('late');playResultSound('fail')}}function reset(){running=false;if(raf)cancelAnimationFrame(raf);stopSlots();stopFaces();timer.textContent='0.00';result.className='result';result.textContent='준비되면 시작!';bubble.textContent='10초를 맞추세요!';main.textContent='START';resetSlots();setFace('idle')}main.onclick=()=>running?stopGame():startGame();again.onclick=reset;gear.onclick=()=>settings.classList.toggle('show');save.onclick=()=>{const a=parseFloat(minInput.value),b=parseFloat(maxInput.value),t=parseFloat(targetInput.value);if(!Number.isFinite(a)||!Number.isFinite(b)||!Number.isFinite(t)||a>b)return;title.textContent=titleInput.value.trim()||'10초 맞추기';min=+a.toFixed(2);max=+b.toFixed(2);target=+t.toFixed(2);rangeText.textContent=min.toFixed(2)+' ~ '+max.toFixed(2)+'초';targetText.textContent=target.toFixed(2)+'초';topRule.textContent=min.toFixed(2)+' ~ '+max.toFixed(2)+'초에 멈추면 성공!';settings.classList.remove('show');reset()};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));reset()})();</script></body></html>
